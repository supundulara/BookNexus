apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: booknexus
data:
  #database connection info
  DB_HOST: postgres #Service name, not localHost
  DB_PORT: "5432"
  DB_NAME: booknexus_db
  DB_USER: postgres
  DB_PASSWORD: postgres

  # App config
  PORT: "5000:5000"
  NODE_ENV: production
