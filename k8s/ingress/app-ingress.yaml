apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booknexus-ingress
  namespace: booknexus
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: booknexus-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: booknexus
spec:
  stripPrefix:
    prefixes:
      - /api