version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: booknexus-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booknexus-network
    command: sh -c "npm run seed && node --loader ts-node/esm src/seeders/bookSeeder.ts && npm start"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: booknexus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - booknexus-network

  postgres:
    image: postgres:15
    container_name: booknexus_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booknexus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - booknexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  booknexus-network:
    driver: bridge